services:
  peach:
    image: cnsunsz/medianfo:${MEDIANFO_VERSION:-edge}
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 75s
    ports:
      - "${MEDIANFO_BIND:-127.0.0.1}:${MEDIANFO_PORT:-8900}:8900"
    volumes:
      - medianfo-data:/data
      - type: bind
        source: ${MEDIANFO_MEDIA_ROOT:-./media}
        target: /media
        read_only: true
        bind:
          propagation: rslave
          create_host_path: false

volumes:
  medianfo-data:
